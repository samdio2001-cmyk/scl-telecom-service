<!-- CHAT FLOTANTE WHATSAPP -->
<div class="whatsapp-container">
    <!-- Bubble flotante -->
    <div class="whatsapp-bubble">
        <i class="bi bi-whatsapp"></i>
    </div>

    <!-- Tooltip -->
    <div class="whatsapp-tooltip">
        ¡Hablemos por WhatsApp!
    </div>

    <!-- Popup del chat -->
    <div class="whatsapp-popup">
        <!-- Botón cerrar -->
        <button class="whatsapp-close">
            <i class="bi bi-x-lg"></i>
        </button>

        <!-- Encabezado -->
        <div class="whatsapp-header">
            <h4>SCL Telecom Service</h4>
            <p>Usualmente responde en minutos</p>
        </div>

        <!-- Cuerpo del mensaje -->
        <div class="whatsapp-body">
            <div class="whatsapp-message">
                ¡Hola! 👋 Bienvenido a SCL Telecom Service. 
                
                ¿Cómo podemos ayudarte hoy?
            </div>

            <!-- Botones de acción -->
            <div class="whatsapp-buttons">
                <button class="whatsapp-btn whatsapp-btn-primary">
                    <i class="bi bi-chat-dots"></i>
                    Enviar Mensaje
                </button>
                <a href="tel:+5077589716" class="whatsapp-btn whatsapp-btn-secondary">
                    <i class="bi bi-telephone"></i>
                    Llamar Ahora
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Script del chat flotante -->
<script src="js/whatsapp-chat.js"></script>
