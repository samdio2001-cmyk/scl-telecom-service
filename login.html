<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo | SCL TELECOM SERVICES</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0d1b3e;
            --blue-mid: #1f3a93;
            --blue-bright: #0d47a1;
            --cyan: #17a2b8;
            --cyan-glow: rgba(23,162,184,0.25);
            --gold: #f0b429;
            --surface: rgba(255,255,255,0.04);
            --border: rgba(23,162,184,0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: var(--navy);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(23,162,184,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(23,162,184,0.06) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0,0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Glowing orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: pulse 8s ease-in-out infinite;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: var(--blue-mid);
            top: -100px; left: -100px;
        }
        .orb-2 {
            width: 300px; height: 300px;
            background: var(--cyan);
            bottom: -80px; right: -80px;
            animation-delay: 4s;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.12; transform: scale(1); }
            50% { opacity: 0.22; transform: scale(1.1); }
        }

        /* Login Card */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
        }

        .login-card {
            background: rgba(13, 27, 62, 0.85);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            backdrop-filter: blur(20px);
            box-shadow:
                0 0 0 1px rgba(23,162,184,0.1),
                0 25px 60px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.05);
            animation: cardIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Logo */
        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, var(--blue-mid), var(--cyan));
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            margin-bottom: 1rem;
            box-shadow: 0 8px 30px var(--cyan-glow);
        }

        .login-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .login-subtitle {
            color: var(--cyan);
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 0.25rem;
            opacity: 0.8;
        }

        /* Form Elements */
        .form-label {
            color: rgba(255,255,255,0.6);
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-control {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(23,162,184,0.08);
            border-color: var(--cyan);
            color: #fff;
            box-shadow: 0 0 0 3px rgba(23,162,184,0.15);
        }

        .form-control::placeholder { color: rgba(255,255,255,0.25); }

        .input-group-text {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-right: none;
            color: var(--cyan);
            border-radius: 10px 0 0 10px;
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 10px 10px 0;
        }

        .input-group:focus-within .input-group-text {
            border-color: var(--cyan);
            background: rgba(23,162,184,0.08);
        }

        /* Toggle password */
        .toggle-pw {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-left: none;
            border-radius: 0 10px 10px 0 !important;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: color 0.2s;
        }
        .toggle-pw:hover { color: var(--cyan); }

        /* Submit Button */
        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, var(--blue-mid), var(--cyan));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--cyan), var(--blue-mid));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn-login:hover::before { opacity: 1; }
        .btn-login span { position: relative; z-index: 1; }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(23,162,184,0.4);
        }

        .btn-login:active { transform: translateY(0); }

        /* Alert Error */
        .alert-error {
            background: rgba(220,53,69,0.12);
            border: 1px solid rgba(220,53,69,0.3);
            color: #ff6b7a;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            display: none;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* Footer line */
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: rgba(255,255,255,0.2);
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Loading state */
        .btn-login.loading .spinner-border {
            display: inline-block;
        }
        .spinner-border { display: none; width: 1rem; height: 1rem; }

        /* Back link */
        .back-link {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: rgba(255,255,255,0.35);
            font-size: 0.8rem;
            text-decoration: none;
            margin-bottom: 1.5rem;
            transition: color 0.2s;
            width: fit-content;
        }
        .back-link:hover { color: var(--cyan); }

        /* Security badge */
        .security-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(23,162,184,0.08);
            border: 1px solid rgba(23,162,184,0.15);
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            margin-top: 1.5rem;
            color: rgba(255,255,255,0.35);
            font-size: 0.72rem;
            letter-spacing: 1px;
        }
        .security-badge i { color: var(--cyan); font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="login-wrapper">
    <a href="index.php" class="back-link">
        <i class="bi bi-arrow-left"></i> Volver al sitio
    </a>

    <div class="login-card">
        <div class="login-logo">
            <div class="logo-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <div class="login-title">SCL TELECOM</div>
            <div class="login-subtitle">Panel Administrativo</div>
        </div>

        <div class="alert-error" id="alertError">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            Credenciales incorrectas. Inténtalo de nuevo.
        </div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text" class="form-control" id="username"
                           placeholder="Ingresa tu usuario" autocomplete="username" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                    <input type="password" class="form-control" id="password"
                           placeholder="••••••••" autocomplete="current-password" required>
                    <button class="btn toggle-pw" type="button" id="togglePw">
                        <i class="bi bi-eye-fill" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-text">
                    <span class="spinner-border me-2" role="status"></span>
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Ingresar al Panel
                </span>
            </button>
        </form>

        <div class="security-badge">
            <i class="bi bi-lock-fill"></i>
            Conexión segura · Acceso restringido a personal autorizado
        </div>

        <div class="login-footer">
            SCL Telecom Services © 2025 · v2.0
        </div>
